<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Destination</title>
  <link rel="stylesheet" href="styles/stylesheet.css"/>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Travel Now</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#destinations">Destinations</a></li>
      <li><a href="#">Contacts</a></li>
    </ul>
  </nav>
  
  <header class="hero">
    <div class="hero-content">
      <h1>Explore the world</h1>
      <p>Discover nearby places</p>
      <a href="#destinations" class="btn">Start your journey</a>      
    </div>
  </header>
  
  <section id="destinations" class="destinations">
    <h2>Top destinations</h2>
    <div class="cards">
      <div class="card">
        <img src="images/paris.jpg" alt="Paris">
        <h3>Paris</h3>
        <p>The city of lights</p>
      </div>
    
      <div class="card">
        <img src="images/bali.jpeg" alt="Bali">
        <h3>Bali</h3>
        <p>Tropical paradise</p>
      </div>
      
      <div class="card">
        <img src="images/newyork.jpeg" alt="New York">
        <h3>New York</h3>
        <p>The city that never sleeps</p>
      </div>      
    </div>
  </section>
</body>
</html>
